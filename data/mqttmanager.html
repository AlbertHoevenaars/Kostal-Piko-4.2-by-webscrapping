<!DOCTYPE html>
<html>
<head>
  <title>KostalPiko MQTT Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
    
    <script type="text/javascript">
    <!-- the script below will take care that at page load the date/time is viewed -->
        
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {              <!-- will execute a function when the readyState changes -->
          if (this.readyState == 4 && this.status == 200) {  <!-- 4: request finished and response is ready; 200: "OK" -->
            document.getElementById("datetime").innerHTML = this.responseText;
          }
        };
       
        xhttp.open("GET", "/datetime", true);  <!-- send a reqeust to the server -->
        xhttp.send(); 
  
    </script>    

</head>

<body>

    <h1>KostalPiko MQTT Manager</h1>
    <h2 id="datetime">Current Date and Time: </h2>
    <br>

    <noscript>You need to enable JavaScript!</noscript>    

    <table class="table_index">
      <thead>
        <tr >
          <td><h1>Item</h1></td>
          <td><h1>Value</h1></td>
        </tr>
      </thead>
      
      <tbody>

         <div class="form-container">
              <form action="/mqttmanager_update" method="POST">
                  <tr>
                    <td>
                      <h3><strong>MQTT Host:</strong></h3>
                    </td>
                    <td>
                       <input type="text" id="mqtt_host" name="MQTT_HOST" placeholder="IP like 192.168.1.200" value=%MQTT_HOST%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                      <h3><strong>MQTT Port:</strong></h3>
                    </td>
                    <td>
                       <input type="text" id ="mqtt_port" name="MQTT_PORT" placeholder="Mostly 1883" value=%MQTT_PORT%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                      <h3><strong>MQTT User:</strong></h3>
                    </td>
                    <td>
                       <input type="text" id ="mqtt_user" name="MQTT_USER" placeholder="Username for MQTT" value=%MQTT_USER%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                      <h3><strong>MQTT password:</strong></h3>
                    </td>
                    <td>
                       <input type="text" id ="mqtt_password" name="MQTT_PASSWORD" placeholder="Password for MQTT" value=%MQTT_PASSWORD%>
                    </td>
                  </tr> 

                  <tr>
                    <td>
                       <h3><strong>Submit:</strong></h3>
                    </td>
                    <td>
                      <a href="/mqttmanager_update">
                      <button class="button">Submit changes </button>
                      </a>
                    </td>
                  </tr> 
             </form>
         </div>
      </tbody>
   </table>
   
   <body>
      <!-- button to get back to main page -->
    <p>
      <a href="/">
      <button class="button">Back to Main page</button>
      </a>
    </p>  
  
   <script> 
   var input = document.querySelectorAll('input');
   for(i=0; i<input.length; i++){
    input[i].setAttribute('size',input[i].getAttribute('placeholder').length);
   } 
   </script> 

    <script type="text/javascript">
    
      var value_interval = setInterval(function() {

        <!-- update date & time value -->
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
          if (this.readyState == 4 && this.status == 200) {
            document.getElementById("datetime").innerHTML = this.responseText; // responsetext comes from server
          }
        };
        xhttp.open("GET", "/datetime", true);
        xhttp.send();                           // send to server
       }, 10000); //10 Seconds update rate 
    </script>
 
  </body> 
   
</html>
