<!DOCTYPE html>
<html>
<head>
  <title>KostalPiko Reader Wi-Fi Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
    
    <script type="text/javascript">
    <!-- the script below will take care that at page load the date/time is viewed -->
        
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {              <!-- will execute a function when the readyState changes -->
          if (this.readyState == 4 && this.status == 200) {  <!-- 4: request finished and response is ready; 200: "OK" -->
            document.getElementById("datetime").innerHTML = this.responseText;
          }
        };
       
        xhttp.open("GET", "/datetime", true);  <!-- send a reqeust to the server -->
        xhttp.send(); 
  
    </script>    

</head>

<body>

    <h1>KostalPiko Wi-Fi Manager</h1>
    <h2 id="datetime">Current Date and Time: </h2>
    <br>

    <noscript>You need to enable JavaScript!</noscript>    

    <table class="table_index">
      <thead>
        <tr >
          <td><h1>Item</h1></td>
          <td><h1>Value</h1></td>
        </tr>
      </thead>
      
      <tbody>
         <div class="form-container">
             <form action="/wifimanager_update" method="POST">
                  <tr>
                    <td>
                      <h3><strong>SSID:</strong></h3>
                    </td>
                    <td>
                       <input type="text" id="wifi_ssid" name="WIFI_SSID" placeholder="SSID of your home network" value=%WIFI_SSID%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                       <h3><strong>Password:</strong></h3>
                    </td>
                    <td>
                       <input type="text" id="wifi_password" name="WIFI_PASSWORD" placeholder="Password of your home network" value=%WIFI_PASSWORD%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                       <h3><strong>IP Address:</strong></h3>
                    </td>
                    <td>
                       <input type="text" id ="wifi_ip" name="WIFI_IP" placeholder="Fixed IP address for the Kostal_Piko Reader" value=%WIFI_IP% >
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                       <h3><strong>Gateway Address:</strong></h3>
                    </td>
                    <td>
                       <input type="text" id ="wifi_gateway" name="WIFI_GATEWAY" placeholder="Mostly the IP address of your router" value=%WIFI_GATWAY%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                       <h3><strong>Subnet:</strong></h3>
                    </td>
                    <td>
                      <input type="text" id ="wifi_subnet" name="WIFI_SUBNET" placeholder="Probably 255.255.255.0" value=%WIFI_SUBNET%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                       <h3><strong>Primary DNS:</strong></h3>
                    </td>
                    <td>
                      <input type="text" id ="wifi_dns1" name="WIFI_DNS1" placeholder="Probably the IP address of your router" value=%WIFI_DNS1%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                       <h3><strong>Secondary DNS:</strong></h3>
                    </td>
                    <td>
                      <input type="text" id ="wifi_dns2" name="WIFI_DNS2" placeholder="In most cases the IP address of your router" value=%WIFI_DNS2%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                       <h3><strong>Network Name:</strong></h3>
                    </td>
                    <td>
                      <input type="text" id ="wifi_networkname" name="WIFI_NETWORKNAME" placeholder="Name on the network for the KostalPiko Reader" value=%WIFI_NETWORKNAME%>
                    </td>
                  </tr> 
         
                  <tr>
                    <td>
                       <h3><strong>Submit:</strong></h3>
                    </td>
                    <td>
                      <a href="/wifimanager_update">
                      <button class="button">Submit changes </button>
                      </a>
                    </td>
                  </tr> 
             </form>
         </div>
      </tbody>
   </table>
   
   <body>
      <!-- button to get back to main page -->
    <p>
      <a href="/">
      <button class="button">Back to Main page</button>
      </a>
    </p>  
  
   <script> 
   var input = document.querySelectorAll('input');
   for(i=0; i<input.length; i++){
    input[i].setAttribute('size',input[i].getAttribute('placeholder').length);
   } 
   </script> 

    <script type="text/javascript">
    
      var value_interval = setInterval(function() {

        <!-- update date & time value -->
        var xhttp = new XMLHttpRequest();
        xhttp.onreadystatechange = function() {
          if (this.readyState == 4 && this.status == 200) {
            document.getElementById("datetime").innerHTML = this.responseText; // responsetext comes from server
          }
        };
        xhttp.open("GET", "/datetime", true);
        xhttp.send();                           // send to server
       }, 10000); //10 Seconds update rate 
    </script>
 
  </body> 
   
</html>
